<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="700" viewBox="0 0 1400 700"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52667a"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="45" y="48" font-family="Arial,sans-serif" font-size="26" fill="#122d48" font-weight="700" text-anchor="start">FríoTrack  C4 nivel 1  Contexto del sistema</text>
<text x="45" y="78" font-family="Arial,sans-serif" font-size="16" fill="#4b6072" font-weight="400" text-anchor="start">Alcance implementado TB1; sensores físicos y correo transaccional son integraciones futuras.</text>
<rect x="70" y="160" width="335" height="150" rx="8" fill="#f1f3f5" stroke="#527b9f" stroke-width="2"/>
<text x="88" y="187" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Persona</text>
<text x="88" y="213" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Coordinador Logístico</text>
<text x="88" y="242" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Programa envíos y recursos.</text>
<text x="88" y="265" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Atiende alertas de demostración.</text>
<rect x="70" y="405" width="335" height="150" rx="8" fill="#f1f3f5" stroke="#527b9f" stroke-width="2"/>
<text x="88" y="432" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Persona</text>
<text x="88" y="458" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Cliente de Carga</text>
<text x="88" y="487" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Consulta sus envíos asignados.</text>
<text x="88" y="510" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Obtiene reportes de demostración.</text>
<rect x="555" y="260" width="370" height="190" rx="8" fill="#edf5fb" stroke="#527b9f" stroke-width="2"/>
<text x="573" y="287" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Sistema de software</text>
<text x="573" y="313" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">FríoTrack</text>
<text x="573" y="342" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Gestiona transporte refrigerado.</text>
<text x="573" y="365" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Autentica y autoriza solicitudes.</text>
<text x="573" y="388" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Conserva operaciones y datos demo.</text>
<rect x="1060" y="275" width="290" height="160" rx="8" fill="#f1f3f5" stroke="#527b9f" stroke-width="2"/>
<text x="1078" y="302" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Sistema externo</text>
<text x="1078" y="328" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">OpenStreetMap</text>
<text x="1078" y="357" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Proporciona teselas del mapa.</text>
<text x="1078" y="380" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">No recibe credenciales FríoTrack.</text>
<polyline points="405,235 475,235 475,300 555,300" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="214" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Usa vía HTTPS</text>
<polyline points="405,480 475,480 475,410 555,410" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="505" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Usa vía HTTPS</text>
<polyline points="925,355 1060,355" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="992" y="335" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Teselas HTTPS</text>
<text x="45" y="676" font-family="Arial,sans-serif" font-size="13" fill="#596d7e" font-weight="400" text-anchor="start">Leyenda: azul = software propio; gris = persona o sistema externo; flecha = dependencia dirigida.</text>
</svg>