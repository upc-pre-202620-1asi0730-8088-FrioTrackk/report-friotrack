<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img"><title>FríoTrack · Frontend components</title><desc>Vue views use a shared HTTP workspace and session module.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="850" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="28" font-weight="700" fill="#142b45">FríoTrack · Frontend components</text><text x="40" y="81" font-size="17" fill="#475569">Vue views use a shared HTTP workspace and session module.</text><path d="M205,280 L470,450" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="345.5" y="353.0" font-size="15" fill="#475569">uses</text><path d="M645,280 L645,405" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="653.0" y="330.5" font-size="15" fill="#475569">uses</text><path d="M1075,280 L820,450" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="955.5" y="353.0" font-size="15" fill="#475569">uses</text><path d="M645,565 L645,670" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="653.0" y="605.5" font-size="15" fill="#475569">HTTPS / JSON</text><rect x="40" y="150" width="330" height="130" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="58" y="180" font-size="20" font-weight="700" fill="#142b45">Access / Profile views</text><text x="58" y="210" font-size="17" fill="#334155">Login, client registration</text><text x="58" y="235" font-size="17" fill="#334155">Preferences and account view</text><rect x="470" y="150" width="350" height="130" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="488" y="180" font-size="20" font-weight="700" fill="#142b45">Shipment / Fleet views</text><text x="488" y="210" font-size="17" fill="#334155">List, details and four-step wizard</text><text x="488" y="235" font-size="17" fill="#334155">Vehicles, drivers and transitions</text><rect x="910" y="150" width="330" height="130" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="928" y="180" font-size="20" font-weight="700" fill="#142b45">Monitoring / Alert views</text><text x="928" y="210" font-size="17" fill="#334155">Readings, map, history, actions</text><text x="928" y="235" font-size="17" fill="#334155">Test-data labels and export</text><rect x="470" y="405" width="350" height="160" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="488" y="435" font-size="20" font-weight="700" fill="#142b45">Workspace repository</text><text x="488" y="465" font-size="17" fill="#334155">workspace-repository.js</text><text x="488" y="490" font-size="17" fill="#334155">Reactive data and profile refs</text><text x="488" y="515" font-size="17" fill="#334155">fetch: workspace and commands</text><text x="488" y="540" font-size="17" fill="#334155">Session token: sessionStorage</text><rect x="40" y="405" width="330" height="160" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="58" y="435" font-size="20" font-weight="700" fill="#142b45">Shared UI / i18n</text><text x="58" y="465" font-size="17" fill="#334155">PrimeVue components</text><text x="58" y="490" font-size="17" fill="#334155">Hash navigation and focus</text><text x="58" y="515" font-size="17" fill="#334155">English / Spanish translations</text><rect x="910" y="405" width="330" height="160" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="928" y="435" font-size="20" font-weight="700" fill="#142b45">Domain helpers</text><text x="928" y="465" font-size="17" fill="#334155">operations.js</text><text x="928" y="490" font-size="17" fill="#334155">Presentation and validation</text><text x="928" y="515" font-size="17" fill="#334155">Domain tests independent of Vue</text><rect x="470" y="670" width="350" height="115" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="488" y="700" font-size="20" font-weight="700" fill="#142b45">ASP.NET Core API</text><text x="488" y="730" font-size="17" fill="#334155">Server-side permissions</text><text x="488" y="755" font-size="17" fill="#334155">Filtered state and persistence</text><text x="40" y="818" font-size="16" fill="#475569">Server identity and authorization are required for protected data and coordination commands.</text></g></svg>