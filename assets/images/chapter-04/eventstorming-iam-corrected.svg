<text x="55" y="730" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Diseño pendiente: recuperación por correo con token de uso único y bloqueo por cuenta. No implementados en TB1.</text>
<text x="45" y="776" font-family="Arial,sans-serif" font-size="13" fill="#596d7e" font-weight="400" text-anchor="start">El diagrama no afirma ejecución de sensores físicos, correo transaccional ni un dispatcher de eventos.</text>
