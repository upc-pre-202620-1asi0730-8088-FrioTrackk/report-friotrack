<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1100" viewBox="0 0 1400 1100"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52667a"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="45" y="48" font-family="Arial,sans-serif" font-size="26" fill="#122d48" font-weight="700" text-anchor="start">FríoTrack  C4 nivel 2  Contenedores</text>
<text x="45" y="78" font-family="Arial,sans-serif" font-size="16" fill="#4b6072" font-weight="400" text-anchor="start">La Web Application entrega archivos; la SPA se ejecuta en el navegador. Ambas tienen responsabilidades distintas.</text>
<path d="M40,245 H1360 V960 H480 V610 H40 Z" fill="none" stroke="#8698a8" stroke-width="2" stroke-dasharray="8 5"/>
<text x="58" y="272" font-family="Arial,sans-serif" font-size="16" fill="#344d63" font-weight="700" text-anchor="start">Límite del sistema FríoTrack  •  implementación TB1</text>
<rect x="65" y="115" width="345" height="100" rx="8" fill="#f1f3f5" stroke="#527b9f" stroke-width="2"/>
<text x="83" y="142" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Persona</text>
<text x="83" y="168" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Visitante</text>
<rect x="800" y="115" width="490" height="100" rx="8" fill="#f1f3f5" stroke="#527b9f" stroke-width="2"/>
<text x="818" y="142" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Persona</text>
<text x="818" y="168" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Coordinador / Cliente de Carga</text>
<rect x="80" y="310" width="345" height="165" rx="8" fill="#edf5fb" stroke="#527b9f" stroke-width="2"/>
<text x="98" y="337" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Contenedor · HTML / CSS / JavaScript</text>
<text x="98" y="363" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Landing Page</text>
<text x="98" y="392" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Sitio público /landing/.</text>
<text x="98" y="415" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Explica el producto y ofrece CTA.</text>
<text x="98" y="438" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Servido por Azure Static Website.</text>
<rect x="525" y="310" width="345" height="165" rx="8" fill="#edf5fb" stroke="#527b9f" stroke-width="2"/>
<text x="543" y="337" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Contenedor · servidor web estático</text>
<text x="543" y="363" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Web Application</text>
<text x="543" y="392" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Entrega index.html y bundle.</text>
<text x="543" y="415" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Azure Storage Static Website.</text>
<text x="543" y="438" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">No ejecuta lógica Vue.</text>
<rect x="970" y="310" width="345" height="165" rx="8" fill="#edf5fb" stroke="#527b9f" stroke-width="2"/>
<text x="988" y="337" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Contenedor · Vue 3 / PrimeVue</text>
<text x="988" y="363" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Single Page Application</text>
<text x="988" y="392" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Se ejecuta en el navegador.</text>
<text x="988" y="415" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Navegación y vistas por contexto.</text>
<text x="988" y="438" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Consume API con fetch.</text>
<rect x="970" y="665" width="345" height="175" rx="8" fill="#edf5fb" stroke="#527b9f" stroke-width="2"/>
<text x="988" y="692" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Contenedor · ASP.NET Core 10 / C#</text>
<text x="988" y="718" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">API de apoyo</text>
<text x="988" y="747" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Autentica, autoriza y valida.</text>
<text x="988" y="770" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Procesa consultas y comandos.</text>
<text x="988" y="793" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Azure App Service.</text>
<rect x="525" y="665" width="345" height="175" rx="8" fill="#edf5fb" stroke="#527b9f" stroke-width="2"/>
<text x="543" y="692" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Contenedor de datos · archivo JSON</text>
<text x="543" y="718" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Almacén privado</text>
<text x="543" y="747" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Cuentas, sesiones y workspace.</text>
<text x="543" y="770" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Lectura/escritura en servidor.</text>
<text x="543" y="793" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Una instancia; sin PostgreSQL.</text>
<rect x="80" y="665" width="345" height="145" rx="8" fill="#f1f3f5" stroke="#527b9f" stroke-width="2"/>
<text x="98" y="692" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Sistema externo · teselas</text>
<text x="98" y="718" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">OpenStreetMap</text>
<text x="98" y="747" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Integración HTTPS desde la SPA.</text>
<polyline points="235,215 235,310" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="325" y="235" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Consulta HTTPS</text>
<polyline points="425,395 525,395" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="477" y="375" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">CTA / URL</text>
<polyline points="870,395 970,395" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="920" y="375" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">HTML / JS / CSS</text>
<polyline points="1000,215 1000,270 700,270 700,310" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="790" y="253" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Solicita página HTTPS</text>
<polyline points="1180,215 1180,310" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1255" y="270" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Interactúa</text>
<polyline points="1140,475 1140,665" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1138" y="568" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">HTTPS / JSON / Bearer opaco</text>
<polyline points="970,750 870,750" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="920" y="728" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Lee / guarda</text>
<polyline points="1030,475 1030,570 250,570 250,665" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)"/>
<text x="480" y="550" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Obtiene teselas HTTPS</text>
<text x="75" y="1002" font-family="Arial,sans-serif" font-size="17" fill="#20384e" font-weight="400" text-anchor="start">Evolución prevista: API con agregados DDD, EF Core y PostgreSQL; adaptadores de sensores y correo.</text>
<text x="75" y="1030" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Los cinco contenedores propios son unidades lógicas; landing y Web Application comparten el hosting estático.</text>
<text x="45" y="1076" font-family="Arial,sans-serif" font-size="13" fill="#596d7e" font-weight="400" text-anchor="start">Leyenda: azul = software propio; gris = persona o sistema externo; flecha = dependencia dirigida.</text>
</svg>