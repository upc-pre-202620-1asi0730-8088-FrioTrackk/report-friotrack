<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="780" viewBox="0 0 1820 780" role="img"><title>FríoTrack ERD relacional previsto: Monitoreo y telemetría</title><desc>Dibujo vectorial programático de una especificación editable. No compilación de PlantUML/Mermaid ni API/DB ejecutados. Relaciones completas en la fuente y tabla del informe.</desc><defs><marker id="arrow" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 -4L9 0 0 4" fill="none" stroke="#52647a" stroke-width="1.6"/></marker></defs><rect width="1820" height="780" fill="white"/><g font-family="Arial, sans-serif"><text x="60" y="50" font-size="30" font-weight="bold" fill="#0f172a">ERD relacional previsto: Monitoreo y telemetría</text><text x="60" y="86" font-size="18" fill="#52647a">Diseño previsto. Especificación editable y SVG programático. No API, SQL ni compilación de diagramas ejecutados.</text><text x="598" y="336" font-size="18" >1</text><text x="599" y="294" font-size="18" >0..*</text><path d="M590 310H620V310H650" fill="none" stroke="#52647a" stroke-width="1.8" marker-end="url(#arrow)"/><text x="605" y="270" font-size="15" fill="#52647a" transform="rotate(-90 605 270)">monitoringId</text><g><rect x="60" y="140" width="530" height="370" fill="white" stroke="#73869b" stroke-width="1.5"/><rect x="60" y="140" width="530" height="66" fill="#e2f6f3" stroke="#73869b"/><text x="75" y="164" font-size="15" fill="#52647a">Monitoring</text><text x="75" y="192" font-size="22" font-weight="bold" fill="#10283e">shipment_monitorings</text><text x="75" y="233" font-size="18" fill="#20374f">PK         id: uuid</text><text x="75" y="257" font-size="18" fill="#20374f">FK UK      shipment_id: uuid</text><text x="75" y="281" font-size="18" fill="#20374f">           min_temp_c: numeric(5,2)</text><text x="75" y="305" font-size="18" fill="#20374f">           max_temp_c: numeric(5,2)</text><text x="75" y="329" font-size="18" fill="#20374f">           min_humidity_pct: numeric(5,2)</text><text x="75" y="353" font-size="18" fill="#20374f">           max_humidity_pct: numeric(5,2)</text><text x="75" y="377" font-size="18" fill="#20374f">           tolerance_minutes: integer</text><text x="75" y="401" font-size="18" fill="#20374f">           max_silence_minutes: integer</text><text x="75" y="425" font-size="18" fill="#20374f">           signal_status: varchar(16)</text><text x="75" y="449" font-size="18" fill="#20374f">nullable   last_reading_at: timestamptz</text><text x="75" y="473" font-size="18" fill="#20374f">           started_at: timestamptz</text><text x="75" y="497" font-size="18" fill="#20374f">nullable   stopped_at: timestamptz</text></g><g><rect x="650" y="140" width="530" height="226" fill="white" stroke="#73869b" stroke-width="1.5"/><rect x="650" y="140" width="530" height="66" fill="#e2f6f3" stroke="#73869b"/><text x="665" y="164" font-size="15" fill="#52647a">Monitoring</text><text x="665" y="192" font-size="22" font-weight="bold" fill="#10283e">sensor_readings</text><text x="665" y="233" font-size="18" fill="#20374f">PK         id: bigint</text><text x="665" y="257" font-size="18" fill="#20374f">FK         monitoring_id: uuid</text><text x="665" y="281" font-size="18" fill="#20374f">           temperature_c: numeric(5,2)</text><text x="665" y="305" font-size="18" fill="#20374f">           humidity_pct: numeric(5,2)</text><text x="665" y="329" font-size="18" fill="#20374f">           within_both_ranges: boolean</text><text x="665" y="353" font-size="18" fill="#20374f">           recorded_at: timestamptz</text></g><g><rect x="1240" y="140" width="530" height="202" fill="white" stroke="#73869b" stroke-width="1.5"/><rect x="1240" y="140" width="530" height="66" fill="#e2f6f3" stroke="#73869b"/><text x="1255" y="164" font-size="15" fill="#52647a">Monitoring</text><text x="1255" y="192" font-size="22" font-weight="bold" fill="#10283e">position_reports</text><text x="1255" y="233" font-si