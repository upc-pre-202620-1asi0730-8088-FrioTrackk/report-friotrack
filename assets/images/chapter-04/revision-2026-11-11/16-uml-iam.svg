<text x="73" y="1202.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222">El registro público requiere consentimiento, correo único y contraseña de al menos 12 caracteres; asigna CARGO_CLIENT.</text>
<text x="73" y="1222.16" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222">La aplicación verifica credenciales mediante un adaptador de hash; el dominio recibe y conserva el hash, nunca texto plano.</text>
<text x="73" y="1241.8400000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222">La recuperación por correo y el bloqueo por cuenta son diseño futuro; TB1 utiliza sesiones opacas y limitación por IP.</text>
