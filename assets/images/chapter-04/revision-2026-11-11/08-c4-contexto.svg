<text x="875.0" y="581.035" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="white">Gestión de transporte refrigerado, consulta térmica</text>
<text x="875.0" y="603.175" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="white">y trazabilidad.</text>
<text x="875.0" y="625.3149999999999" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="white">Control de identidad, permisos y operaciones.</text>
