<text x="220.0" y="675.765" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="white">Programa envíos, administra</text>
<text x="220.0" y="697.905" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="white">recursos y atiende alertas.</text>
