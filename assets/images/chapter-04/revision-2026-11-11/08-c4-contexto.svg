<text x="1530.0" y="531.9499999999999" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="white">[Sistema externo · previsto]</text>
<text x="1530.0" y="570.14" font-family="Arial,sans-serif" font-size="18" font-weight="400" text-anchor="middle" fill="white">Lecturas de temperatura, humedad y</text>
