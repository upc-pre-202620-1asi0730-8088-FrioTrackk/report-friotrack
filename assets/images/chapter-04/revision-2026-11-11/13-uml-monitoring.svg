<text x="73" y="1222.16" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222">Las lecturas usan fecha de medición válida. Una muestra atrasada no demuestra recuperación actual de señal.</text>
<text x="73" y="1241.8400000000001" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222">SignalLost / SignalRestored son eventos propuestos; las excursiones térmicas se evalúan de forma independiente.</text>
