<text x="83" y="1192.48" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222">La raíz protege rango, fechas, peso y transiciones; un borrador no reserva recursos.</text>
<text x="83" y="1212.16" font-family="Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" fill="#222">La aplicación confirma capacidad y reserva de Fleet antes de aceptar programación, en una unidad de trabajo.</text>
