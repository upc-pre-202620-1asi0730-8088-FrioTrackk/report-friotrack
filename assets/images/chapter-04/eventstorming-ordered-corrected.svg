<text x="498" y="212" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">ShipmentScheduled → ReserveResources [1]</text>
<text x="498" y="235" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">TransitStarted → StartMonitoring [2]</text>
