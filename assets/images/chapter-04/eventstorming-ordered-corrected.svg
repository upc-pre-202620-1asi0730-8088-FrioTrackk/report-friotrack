<text x="45" y="1106" font-family="Arial,sans-serif" font-size="13" fill="#596d7e" font-weight="400" text-anchor="start">Los números remiten a la matriz de interdependencias. No se afirma un dispatcher ni ingesta de sensores en TB1.</text>
