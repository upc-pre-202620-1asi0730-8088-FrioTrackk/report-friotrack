<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9" fill="#52667a"/></marker></defs><rect width="100%" height="100%" fill="white"/>
<text x="45" y="48" font-family="Arial,sans-serif" font-size="26" fill="#122d48" font-weight="700" text-anchor="start">FríoTrack  Modelo táctico DDD  Fleet &amp; Resource Management  Apoyo</text>
<text x="45" y="78" font-family="Arial,sans-serif" font-size="16" fill="#4b6072" font-weight="400" text-anchor="start">Diseño objetivo; las clases, puertos y eventos siguientes no equivalen a una implementación en la API JSON de TB1.</text>
<rect x="55" y="155" width="410" height="220" rx="8" fill="#eaf3fa" stroke="#527b9f" stroke-width="2"/>
<text x="73" y="182" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Aggregate Root</text>
<text x="73" y="208" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">FleetAllocation</text>
<text x="73" y="237" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">- id, shipmentId, vehicleId, driverId</text>
<text x="73" y="260" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">- reservedFrom, reservedUntil</text>
<text x="73" y="283" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">+ reserve()  + release()</text>
<rect x="500" y="155" width="410" height="220" rx="8" fill="#f5f8fb" stroke="#527b9f" stroke-width="2"/>
<text x="518" y="182" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Aggregate Root independiente</text>
<text x="518" y="208" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Vehicle</text>
<text x="518" y="237" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">- id, plate, capacity, enabled</text>
<text x="518" y="260" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">+ changeCapacity()  + disable()</text>
<rect x="945" y="155" width="410" height="220" rx="8" fill="#f5f8fb" stroke="#527b9f" stroke-width="2"/>
<text x="963" y="182" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Aggregate Root independiente</text>
<text x="963" y="208" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">Driver</text>
<text x="963" y="237" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">- id, license, enabled</text>
<text x="963" y="260" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">+ disable()</text>
<text x="55" y="435" font-family="Arial,sans-serif" font-size="17" fill="#20384e" font-weight="400" text-anchor="start">Otros agregados se referencian por ID; no hay composición ni navegación directa entre contextos.</text>
<rect x="55" y="480" width="1288" height="120" rx="8" fill="#edf5fb" stroke="#527b9f" stroke-width="2"/>
<text x="73" y="507" font-family="Arial,sans-serif" font-size="13" fill="#52667a" font-weight="400" text-anchor="start">Puerto de repositorio en Domain</text>
<text x="73" y="533" font-family="Arial,sans-serif" font-size="19" fill="#142e48" font-weight="700" text-anchor="start">IAllocationRepository / IVehicleRepository / IDriverRepository</text>
<text x="73" y="562" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">Un repositorio persiste un agregado raíz; Infrastructure implementa el contrato.</text>
<polyline points="260,480 260,375" fill="none" stroke="#52667a" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="345" y="462" font-family="Arial,sans-serif" font-size="14" fill="#344d63" font-weight="400" text-anchor="middle">Persiste raíz</text>
<text x="55" y="650" font-family="Arial,sans-serif" font-size="17" fill="#20384e" font-weight="700" text-anchor="start">Eventos previstos: ResourcesReserved / ResourcesReleased / ResourcesUnavailable</text>
<text x="55" y="695" font-family="Arial,sans-serif" font-size="16" fill="#20384e" font-weight="400" text-anchor="start">FleetAllocation referencia Vehicle y Driver por ID. Una transacción impide reservas solapadas.</text>
<text x="45" y="756" font-family="Arial,sans-serif" font-size="13" fill="#596d7e" font-weight="400" text-anchor="start">Leyenda UML: ◆ composición interna; referencia entre agregados por ID; repositorios solo para raíces. Diseño objetivo.</text>
</svg>