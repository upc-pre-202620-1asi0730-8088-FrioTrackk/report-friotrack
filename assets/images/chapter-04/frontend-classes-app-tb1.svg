<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 850" role="img"><title>FríoTrack · Logical client model</title><desc>JavaScript modules and reactive objects; boxes do not imply implemented JavaScript classes.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="1280" height="850" fill="#f8fafc"/><g font-family="Arial, sans-serif"><text x="40" y="48" font-size="28" font-weight="700" fill="#142b45">FríoTrack · Logical client model</text><text x="40" y="81" font-size="17" fill="#475569">JavaScript modules and reactive objects; boxes do not imply implemented JavaScript classes.</text><path d="M590,267 L710,267" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="658.0" y="255.0" font-size="15" fill="#475569">updates</text><path d="M590,630 L710,630" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="658.0" y="618.0" font-size="15" fill="#475569">shared rules</text><path d="M975,530 L590,340" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="790.5" y="423.0" font-size="15" fill="#475569">HTTP</text><rect x="40" y="145" width="550" height="245" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="58" y="175" font-size="20" font-weight="700" fill="#142b45">«module» WorkspaceRepository</text><text x="58" y="205" font-size="17" fill="#334155">data: Ref&lt;WorkspaceData&gt;</text><text x="58" y="230" font-size="17" fill="#334155">profile: Ref&lt;Profile | null&gt;</text><text x="58" y="255" font-size="17" fill="#334155">login(draft), register(draft), logout()</text><text x="58" y="280" font-size="17" fill="#334155">execute(type, payload), refreshWorkspace()</text><text x="58" y="305" font-size="17" fill="#334155">restoreSession()</text><text x="58" y="330" font-size="17" fill="#334155">private request(path, body)</text><rect x="710" y="145" width="530" height="245" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="728" y="175" font-size="20" font-weight="700" fill="#142b45">«logical object» WorkspaceData</text><text x="728" y="205" font-size="17" fill="#334155">schema, revision</text><text x="728" y="230" font-size="17" fill="#334155">profiles, vehicles, drivers</text><text x="728" y="255" font-size="17" fill="#334155">shipments, alerts, notifications</text><text x="728" y="280" font-size="17" fill="#334155">Returned by the API; filtered for client</text><text x="728" y="305" font-size="17" fill="#334155">Operations store state in server JSON</text><rect x="40" y="530" width="550" height="200" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="58" y="560" font-size="20" font-weight="700" fill="#142b45">«module» DomainOperations</text><text x="58" y="590" font-size="17" fill="#334155">validateShipment(state, draft, excludeId)</text><text x="58" y="615" font-size="17" fill="#334155">applyCommand(state, profile, command)</text><text x="58" y="640" font-size="17" fill="#334155">visibleShipments(state, profile)</text><text x="58" y="665" font-size="17" fill="#334155">thermalStatus(shipment), sampleReport(...)</text><rect x="710" y="530" width="530" height="200" rx="10" fill="#e0f2fe" stroke="#b6c7d8"/><text x="728" y="560" font-size="20" font-weight="700" fill="#142b45">«server service» WorkspaceStore</text><text x="728" y="590" font-size="17" fill="#334155">Login / Register / Workspace / Command</text><text x="728" y="615" font-size="17" fill="#334155">Validate bearer session and actor role</text><text x="728" y="640" font-size="17" fill="#334155">Filter data by customerId</text><text x="728" y="665" font-size="17" fill="#334155">Persist accepted state and revoke sessions</text><text x="40" y="818" font-size="16" fill="#475569">Source: src/infrastructure/workspace-repository.js, src/domains/operations.js and api/Program.cs.</text></g></svg>