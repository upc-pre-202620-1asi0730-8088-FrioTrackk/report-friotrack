<svg xmlns="http://www.w3.org/2000/svg" width="1820" height="1090" viewBox="0 0 1820 1090" role="img" aria-labelledby="title description"><title id="title">FríoTrack: modelo lógico de aplicación e infraestructura</title><desc id="description">Modelo UML lógico de módulos, funciones y objetos de datos del frontend local de FríoTrack. Generado programáticamente desde la misma especificación de la fuente PlantUML; no es una captura ni salida de PlantUML.</desc><defs><marker id="arrow" viewBox="0 -5 10 10" refX="9" refY="0" markerWidth="10" markerHeight="10" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 -4L9 0 0 4" fill="none" stroke="#52657a" stroke-width="1.6"/></marker><marker id="triangle" viewBox="0 -7 14 14" refX="13" refY="0" markerWidth="14" markerHeight="14" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 -6L13 0 0 6Z" fill="white" stroke="#52657a" stroke-width="1.6"/></marker><marker id="diamond" viewBox="0 -6 16 12" refX="0" refY="0" markerWidth="16" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 -5 16 0 8 5Z" fill="#52657a" stroke="#52657a"/></marker><marker id="open-diamond" viewBox="0 -6 16 12" refX="0" refY="0" markerWidth="16" markerHeight="12" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L8 -5 16 0 8 5Z" fill="white" stroke="#52657a"/></marker></defs><rect width="1820" height="1090" fill="#ffffff"/><g font-family="Inter, Arial, sans-serif"><text x="60" y="55" font-size="31" font-weight="700" fill="#0f172a">I. Responsabilidades lógicas de aplicación e infraestructura</text><text x="60" y="87" font-size="19" fill="#52657a">Módulos, funciones y referencias reactivas: estos recuadros no declaran clases JavaScript implementadas.</text><g><rect x="60" y="165" width="650" height="236" rx="11" fill="white" stroke="#718aa4" stroke-width="1.6"/><path d="M71 165H699Q710 165 710 176V234H60V176Q60 165 71 165" fill="#eaf2fe"/><text x="78" y="188" font-size="15" fill="#52657a">«interface · contrato lógico»</text><text x="78" y="216" font-size="24" fill="#0f172a" font-weight="700">IDemoRepository</text><text x="78" y="260" font-size="19" fill="#20354d">+ readData(): DemoData</text><text x="78" y="284" font-size="19" fill="#20354d">+ execute(type: String, payload: Object): Object</text><text x="78" y="308" font-size="19" fill="#20354d">+ registerSample(draft: Object): DemoProfile</text><text x="78" y="332" font-size="19" fill="#20354d">+ enterSample(id: String): void</text><text x="78" y="356" font-size="19" fill="#20354d">+ leaveSample(): void</text><text x="78" y="380" font-size="19" fill="#20354d">+ resetSamples(): void</text></g><g><rect x="60" y="560" width="650" height="325" rx="11" fill="white" stroke="#718aa4" stroke-width="1.6"/><path d="M71 560H699Q710 560 710 571V629H60V571Q60 560 71 560" fill="#eaf2fe"/><text x="78" y="583" font-size="15" fill="#52657a">«módulo»</text><text x="78" y="611" font-size="24" fill="#0f172a" font-weight="700">DemoRepository</text><text x="78" y="655" font-size="19" fill="#20354d">− storageKey: String</text><text x="78" y="679" font-size="19" fill="#20354d">− profileId: String?</text><path d="M60 695H710" stroke="#dbe4ee"/><text x="78" y="720" font-size="19" fill="#20354d">− readData(): DemoData</text><text x="78" y="744" font-size="19" fill="#20354d">− persist(next: DemoData): void</text><text x="78" y="768" font-size="19" fill="#20354d">+ execute(type: String, payload: Object): Object</text><text x="78" y="792" font-size="19" fill="#20354d">+ registerSample(draft: Object): DemoProfile</text><text x="78" y="816" font-size="19" fill="#20354d">+ enterSample(id: String): void</text><text x="78" y="840" font-size="19" fill="#20354d">+ leaveSample(): void</text><text x="78" y="864" font-size="19" fill="#20354d">+ resetSamples(): void</text></g><g><rect x="1000" y="165" width="700" height="164" rx="11" fill="white" stroke="#718aa4" stroke-width="1.6"/><path d="M1011 165H1689Q1700 165 1700 176V234H1000V176Q1000 165 1011 165" fill="#eaf2fe"/><text x="1018" y="188" font-size="15" fill="#52657a">«estado reactivo lógico»</text><text x="1018" y="216" font-size="24" fill="#0f172a" font-weight="700">AppStore</text><text x="1018" y="260" font-size="19" fill="#20354d">+ data: Ref&lt;DemoData&gt;</text><text x="1018" y="284" font-size="19" fill="#20354d">+ profile: ComputedRef&lt;DemoProfile?&gt;</text><text x="1018" y="308" font-size="19" fill="#20354d">+ persistenceWarning: ComputedRef&lt;Boolean&gt;</text></g><g><rect x="1000" y="560" width="750" height="236" rx="11" fill="white" stroke="#718aa4" stroke-width="1.6"/><path d="M1011 560H1739Q1750 560 1750 571V629H1000V571Q1000 560 1011 560" fill="#eaf2fe"/><text x="1018" y="583" font-size="15" fill="#52657a">«módulo de dominio · funciones estáticas»</text><text x="1018" y="611" font-size="24" fill="#0f172a" font-weight="700">Operations</text><text x="1018" y="655" font-size="19" fill="#20354d">+ validateShipment(state, draft, excludeId?): Object</text><text x="1018" y="679" font-size="19" fill="#20354d">+ applyCommand(state, profile, command): Object</text><text x="1018" y="703" font-size="19" fill="#20354d">+ visibleShipments(state, profile): Shipment[]</text><text x="1018" y="727" font-size="19" fill="#20354d">+ canView(profile, shipment): Boolean</text><text x="1018" y="751" font-size="19" fill="#20354d">+ thermalStatus(shipment): ThermalStatus</text><text x="1018" y="775" font-size="19" fill="#20354d">+ sampleReport(state, profile, id): String</text></g><path d="M1000 255H710" fill="none" stroke="#52657a" stroke-width="1.8"    marker-end="url(#arrow)"/><text x="855" y="235" font-size="17" fill="#334155" text-anchor="middle">usa operaciones</text><text x="966" y="280" font-size="17" fill="#0f172a" font-weight="600">1</text><text x="728" y="280" font-size="17" fill="#0f172a" font-weight="600">1</text><path d="M385 560V401" fill="none" stroke="#52657a" stroke-width="1.8" stroke-dasharray="7 5"   marker-end="url(#triangle)"/><text x="415" y="485" font-size="17" fill="#334155" >realiza el contrato lógico</text><path d="M710 725H1000" fill="none" stroke="#52657a" stroke-width="1.8" stroke-dasharray="7 5"   marker-end="url(#arrow)"/><text x="855" y="705" font-size="17" fill="#334155" text-anchor="middle">valida comandos</text><rect x="1000" y="350" width="750" height="103" rx="9" fill="#f5f9fc" stroke="#d3dfea"/><text x="1017" y="377" font-size="17" fill="#52657a">AppStore representa data / profile / persistenceWarning.</text><text x="1017" y="402" font-size="17" fill="#52657a">Vínculos con el panel II: Shipment 0..* y perfil activo 0..1.</text><text x="1017" y="427" font-size="17" fill="#52657a">No hay una clase AppStore ni inyección de interfaz en JS.</text><rect x="60" y="950" width="1690" height="103" rx="9" fill="#f5f9fc" stroke="#d3dfea"/><text x="77" y="977" font-size="17" fill="#52657a">Fuente: apps/friotrack-web/src/infrastructure/demo-repository.js y src/domains/operations.js.</text><text x="77" y="1002" font-size="17" fill="#52657a">readData/persist son funciones internas; execute/registerSample/enterSample/leaveSample/resetSamples son exportadas.</text><text x="77" y="1027" font-size="17" fill="#52657a">Persistencia local de ejemplo. No se acredita autenticación segura, API conectada ni publicación.</text></g></svg>